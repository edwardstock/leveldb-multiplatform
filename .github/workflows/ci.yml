name: PR Check

on:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            gradle_args: ":leveldb:check"
          - os: ubuntu-24.04-arm64
            gradle_args: ":leveldb:check"
          - os: macos-latest
            gradle_args: ":leveldb:check"
          - os: windows-latest
            gradle_args: ":leveldb:mingwX64Test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        env:
          JAVA_TOOL_OPTIONS: "-XX:+CreateCoredumpOnCrash -Xlog:os+signal=debug"
        run: ./gradlew ${{ matrix.gradle_args }}

      - name: Upload JVM crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-crash-${{ matrix.os }}
          path: |
            leveldb/hs_err_pid*.log
            leveldb/core*
