name: Publish

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override Gradle project version (e.g. 2.0.1)"
        required: true
        type: string
      full_tests:
        description: "Run tests on all OS before publishing"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.full_tests == 'true') && '["ubuntu-22.04","ubuntu-24.04-arm","macos-latest"]' || '["ubuntu-22.04","ubuntu-24.04-arm64"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle wrapper
        uses: ./.github/actions/cache-gradle-wrapper

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :leveldb:check

  publish:
    name: Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            install_mingw: true
            publish_tasks: >-
              :leveldb:publishKotlinMultiplatformPublicationToMavenCentralRepository
              :leveldb:publishJvmPublicationToMavenCentralRepository
              :leveldb:publishAndroidPublicationToMavenCentralRepository
              :leveldb:publishLinuxX64PublicationToMavenCentralRepository
              :leveldb:publishMingwX64PublicationToMavenCentralRepository
          - os: ubuntu-24.04-arm
            install_mingw: false
            publish_tasks: >-
              :leveldb:publishLinuxArm64PublicationToMavenCentralRepository
          - os: macos-latest
            install_mingw: false
            publish_tasks: >-
              :leveldb:publishMacosArm64PublicationToMavenCentralRepository
              :leveldb:publishMacosX64PublicationToMavenCentralRepository
              :leveldb:publishIosArm64PublicationToMavenCentralRepository
              :leveldb:publishIosSimulatorArm64PublicationToMavenCentralRepository

    steps:
      - name: Verify publish secrets
        uses: ./.github/actions/check-publish-secrets
        with:
          maven_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install mingw-w64
        if: matrix.install_mingw
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION_ARG=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_ARG="-Pversion=${{ github.event.inputs.version }}"
          fi
          ./gradlew ${VERSION_ARG} ${{ matrix.publish_tasks }}
