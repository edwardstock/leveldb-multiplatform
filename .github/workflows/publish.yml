name: Publish
permissions:
  contents: read
on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Publish a -SNAPSHOT from the selected ref (overwritable; ignores 'version')"
        required: false
        default: true
        type: boolean
      version:
        description: "Release version override (e.g. 2.0.1). Used only when snapshot = false"
        required: false
        type: string
      tests:
        description: "Pre-publish tests: linux (default) | all (linux+macos) | skip"
        required: false
        default: linux
        type: choice
        options:
          - linux
          - all
          - skip

jobs:
  test:
    name: Tests (${{ matrix.os }})
    # Skip the whole gate when the dispatcher chose tests=skip (e.g. this ref already passed CI).
    if: ${{ github.event.inputs.tests != 'skip' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.tests == 'all') && '["ubuntu-22.04","macos-latest"]' || '["ubuntu-22.04"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-android-tools

      - name: Cache Gradle wrapper
        uses: ./.github/actions/cache-gradle-wrapper

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache konan
        uses: ./.github/actions/cache-konan

      - name: Run tests
        run: ./gradlew :leveldb:check

  publish:
    name: Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    # Run when tests passed OR were skipped (tests=skip), but never when they actually failed.
    # Without always() a skipped 'test' would cascade-skip publish too.
    if: ${{ always() && needs.test.result != 'failure' && needs.test.result != 'cancelled' }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            install_mingw: true
            publish_tasks: >-
              :leveldb:publishKotlinMultiplatformPublicationToMavenCentralRepository
              :leveldb:publishJvmPublicationToMavenCentralRepository
              :leveldb:publishAndroidPublicationToMavenCentralRepository
              :leveldb-android-native:publishReleasePublicationToMavenCentralRepository
              :leveldb:publishLinuxX64PublicationToMavenCentralRepository
              :leveldb:publishMingwX64PublicationToMavenCentralRepository
              :leveldb:publishLinuxArm64PublicationToMavenCentralRepository
          - os: macos-latest
            install_mingw: false
            publish_tasks: >-
              :leveldb:publishMacosArm64PublicationToMavenCentralRepository
              :leveldb:publishMacosX64PublicationToMavenCentralRepository
              :leveldb:publishIosArm64PublicationToMavenCentralRepository
              :leveldb:publishIosSimulatorArm64PublicationToMavenCentralRepository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Verify publish secrets
        uses: ./.github/actions/check-publish-secrets
        with:
          maven_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install mingw-w64
        if: matrix.install_mingw
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-android-tools

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache konan
        uses: ./.github/actions/cache-konan

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION_ARG=""
          if [ "${{ github.event.inputs.snapshot }}" = "true" ]; then
            # workflow_dispatch snapshot: the build derives <libVersion>-SNAPSHOT and vanniktech
            # routes it to the Central snapshots repo. Overwritable, no staging/release step.
            VERSION_ARG="-Psnapshot=true"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            # workflow_dispatch release: explicit version override wins.
            VERSION_ARG="-Pversion=${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # tag push: the tag (e.g. 2.0.1) IS the version — otherwise the build falls back to the
            # hardcoded libVersion and would publish the wrong coordinates.
            VERSION_ARG="-Pversion=${{ github.ref_name }}"
          fi
          # -PsignPublications: CI has the signing key (secrets above), so sign everything we push.
          ./gradlew ${VERSION_ARG} -PsignPublications ${{ matrix.publish_tasks }}
