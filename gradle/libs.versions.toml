[versions]
agp = "9.0.0"
kotlin = "2.3.0"
ksp = "2.3.2"
kotlin-coroutines = "1.10.2"
kotlin-atomicfu = "0.30.0"

ndkVersion = "29.0.14206865"
cmakeVersion = "4.1.2"

android-minSdk = "24"
android-compileSdk = "36"

android-lifecycle = "2.10.0"
android-activityCompose = "1.12.2"

compose-plugin = "1.10.0"
compose-bom = "2026.01.00"

vanniktechMavenPublish = "0.36.0"
hilt-base = "2.59"
okio = "3.16.4"

runner = "1.7.0"
core = "1.7.0"
junit = "1.3.0"
material3 = "1.4.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlin-coroutines" }
kotlin-coroutines-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlin-coroutines" }
kotlin-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlin-atomicfu" }

android-core-ktx = { module = "androidx.core:core-ktx", version = "1.17.0" }
android-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "android-lifecycle" }
android-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "android-lifecycle" }

android-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
android-compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "android-activityCompose" }
android-compose-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "android-lifecycle" }

android-compose-foundation = { module = "androidx.compose.foundation:foundation" }
android-compose-runtime = { module = "androidx.compose.runtime:runtime" }
android-compose-ui = { module = "androidx.compose.ui:ui" }
android-compose-ui-googleFonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
android-compose-graphics = { module = "androidx.compose.ui:ui-graphics" }
android-compose-tooling-ui = { module = "androidx.compose.ui:ui-tooling" }
android-compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
android-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
android-compose-material3WindowSizeClass = { module = "androidx.compose.material3:material3-window-size-class" }
android-compose-materialIcons-core = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
android-compose-materialIcons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }


okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

di-hilt-core = { module = "com.google.dagger:hilt-android", version.ref = "hilt-base" }
di-hilt-daggerCompiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt-base" }
di-hilt-work = { module = "androidx.hilt:hilt-work", version = "1.3.0" }
di-hilt-lifecycle = { module = "androidx.hilt:hilt-lifecycle-viewmodel", version = "1.3.0" }
di-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version = "1.3.0" }
di-hilt-navigationCompose = { module = "androidx.hilt:hilt-navigation-compose", version = "1.3.0" }

test-android-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
test-android-core = { group = "androidx.test", name = "core", version.ref = "core" }
test-android-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
test-junit = { group = "junit", name = "junit", version = "4.13.2" }
test-kotlin = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
test-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines"}
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }


[bundles]
composeBom = [
    "android-compose-foundation",
    "android-compose-runtime",
    "android-compose-ui",
    "android-compose-ui-googleFonts",
    "android-compose-graphics",
    "android-compose-tooling-ui",
    "android-compose-tooling-preview",
    "android-compose-material3",
    "android-compose-material3WindowSizeClass",
    "android-compose-materialIcons-core",
    "android-compose-materialIcons-extended",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-core = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "kotlin-atomicfu" }
kotlin-kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.4" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt-base" }

vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
cmake = { id = "com.edwardstock.cmakebuild", version = "0.3.0"}
ktjni = { id = "io.github.fletchmckee.ktjni", version = "0.1.1" }
